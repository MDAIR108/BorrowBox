plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.borrowbox.kuet'
    compileSdkVersion 'android-37.0'

    defaultConfig {
        applicationId "com.borrowbox.kuet"
        minSdk 24
        targetSdkVersion 37
        versionCode 1
        versionName "1.0"

        // Default to detected PC Wi-Fi IP (overridable with -PAPI_BASE_URL="http://...")
        buildConfigField "String", "DEFAULT_API_BASE_URL", "\"${project.findProperty('API_BASE_URL') ?: 'https://judicial-antelope-untrained.ngrok-free.dev'}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.10.1'
    // GridLayout for category grid in SearchActivity
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase (Authentication, Cloud Firestore, Realtime Database, Cloud Storage, Cloud Messaging)
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
}
